<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.name | escape }} – home">
      <!-- LOGO: assets/images/logo.svg (the signature "w"). Replace that file to change it. -->
      <img class="brand__mark" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" width="40" height="40">
      <span class="brand__name">{{ site.name }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Menu</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ '/' | relative_url }}#{{ item.anchor }}" data-spy="{{ item.anchor }}">{{ item.label }}</a></li>
        {% endfor %}
      </ul>
      <a class="btn btn--primary btn--sm" href="{{ site.cv | relative_url }}" target="_blank" rel="noopener">
        CV <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
      </a>
    </nav>
  </div>
</header>
