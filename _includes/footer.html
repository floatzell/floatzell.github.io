<footer class="site-footer on-dark">
  <div class="container footer-inner">
    <p>© {{ 'now' | date: '%Y' }} {{ site.name }} · Built with Jekyll &amp; GitHub Pages</p>
    <ul class="footer-links">
      <li><a href="{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="mailto:{{ site.social.email }}">Email</a></li>
      <li><a href="{{ site.cv | relative_url }}" target="_blank" rel="noopener">CV</a></li>
    </ul>
  </div>
</footer>
