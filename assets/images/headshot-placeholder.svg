<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Placeholder for your profile photo">
  <!-- PLACEHOLDER. To use your own photo: upload a square image (min 800 x 800 px) to assets/images/
       and set profile_image in _config.yml to its file name. -->
